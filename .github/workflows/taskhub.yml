name: TaskHub tests and APK

on:
  push:
    branches: [feature/android-api]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Standalone API does not import Telegram
        run: python -c 'import sys; import backend.main; assert "aiogram" not in sys.modules'

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Compile, test and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: taskhub-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/tests
            android/app/build/reports/lint-results-debug.html
